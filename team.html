<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

.team-section {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;

    background: #0b2b63;
    border-radius: 18px;

    perspective: 1200px;
}

/* --------------------------------
   CAROUSEL TRACK
-------------------------------- */

.team-track {
    position: absolute;

    top: 50%;
    left: 0;

    display: flex;
    align-items: center;
    gap: 28px;

    width: max-content;

    transform:
        translateY(-50%)
        translateX(0);

    will-change: transform;

    cursor: grab;
}

.team-track.dragging {
    cursor: grabbing;
}


/* --------------------------------
   PERSON CARD
-------------------------------- */

.person {
    width: 150px;
    height: 270px;

    flex-shrink: 0;

    position: relative;

    transform-style: preserve-3d;

    transition:
        transform .35s cubic-bezier(.22,1,.36,1),
        filter .35s ease;
}


/* PHOTO */

.person img {
    width: 100%;
    height: 220px;

    object-fit: cover;

    display: block;

    border-radius: 8px;

    border: 2px solid rgba(255,255,255,.8);

    box-shadow:
        0 18px 40px rgba(0,0,0,.3);

    user-select: none;
    -webkit-user-drag: none;
}


/* NAME */

.person-name {
    margin-top: 12px;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 13px;

    text-align: center;

    white-space: nowrap;

    opacity: .9;
}


/* --------------------------------
   DIFFERENT CARD ANGLES
-------------------------------- */

.person:nth-child(4n + 1) {
    transform: rotate(-8deg) translateY(10px);
}

.person:nth-child(4n + 2) {
    transform: rotate(3deg) translateY(-8px);
}

.person:nth-child(4n + 3) {
    transform: rotate(-3deg) translateY(-3px);
}

.person:nth-child(4n + 4) {
    transform: rotate(8deg) translateY(12px);
}


/* --------------------------------
   HOVER
-------------------------------- */

.person:hover {
    transform:
        translateY(-18px)
        rotate(0deg)
        scale(1.06);

    z-index: 10;

    filter: brightness(1.08);
}


/* --------------------------------
   SIDE FADE
-------------------------------- */

.team-section::before,
.team-section::after {

    content: "";

    position: absolute;

    top: 0;

    width: 180px;
    height: 100%;

    z-index: 20;

    pointer-events: none;
}

.team-section::before {

    left: 0;

    background:
        linear-gradient(
            to right,
            #0b2b63,
            transparent
        );
}

.team-section::after {

    right: 0;

    background:
        linear-gradient(
            to left,
            #0b2b63,
            transparent
        );
}


/* --------------------------------
   MOBILE
-------------------------------- */

@media (max-width: 600px) {

    .team-section {
        border-radius: 12px;
    }

    .team-track {
        gap: 18px;
    }

    .person {

        width: 115px;
        height: 220px;
    }

    .person img {

        height: 175px;

        border-radius: 7px;
    }

    .person-name {

        font-size: 11px;

        margin-top: 8px;
    }

    .team-section::before,
    .team-section::after {

        width: 70px;
    }
}

</style>
</head>

<body>

<div class="team-section">

    <div class="team-track" id="teamTrack">

        <!-- PERSON 1 -->
        <div class="person">
            <img src="YOUR-IMAGE-URL-1">
            <div class="person-name">
                Person Name
            </div>
        </div>

        <!-- PERSON 2 -->
        <div class="person">
            <img src="YOUR-IMAGE-URL-2">
            <div class="person-name">
                Person Name
            </div>
        </div>

        <!-- PERSON 3 -->
        <div class="person">
            <img src="YOUR-IMAGE-URL-3">
            <div class="person-name">
                Person Name
            </div>
        </div>

        <!-- PERSON 4 -->
        <div class="person">
            <img src="YOUR-IMAGE-URL-4">
            <div class="person-name">
                Person Name
            </div>
        </div>

        <!-- PERSON 5 -->
        <div class="person">
            <img src="YOUR-IMAGE-URL-5">
            <div class="person-name">
                Person Name
            </div>
        </div>

        <!-- PERSON 6 -->
        <div class="person">
            <img src="YOUR-IMAGE-URL-6">
            <div class="person-name">
                Person Name
            </div>
        </div>

        <!-- PERSON 7 -->
        <div class="person">
            <img src="YOUR-IMAGE-URL-7">
            <div class="person-name">
                Person Name
            </div>
        </div>

        <!-- PERSON 8 -->
        <div class="person">
            <img src="YOUR-IMAGE-URL-8">
            <div class="person-name">
                Person Name
            </div>
        </div>

    </div>

</div>


<script>

const section =
    document.querySelector(".team-section");

const track =
    document.getElementById("teamTrack");


/* --------------------------------
   SETTINGS
-------------------------------- */

let position = 0;

let speed = 0.35;

let dragging = false;

let startX = 0;

let startPosition = 0;

let animation;


/* --------------------------------
   CONTINUOUS MOVEMENT
-------------------------------- */

function animate() {

    if (!dragging) {

        position -= speed;

        checkLoop();
    }

    track.style.transform =
        `translate3d(
            ${position}px,
            -50%,
            0
        )`;

    animation =
        requestAnimationFrame(animate);
}


/* --------------------------------
   INFINITE LOOP
-------------------------------- */

function checkLoop() {

    const firstCard =
        track.children[0];

    if (!firstCard) return;

    const cardWidth =
        firstCard.offsetWidth + 28;

    if (
        Math.abs(position)
        >= cardWidth
    ) {

        position += cardWidth;

        track.appendChild(
            firstCard
        );
    }
}


/* --------------------------------
   MOUSE DRAG
-------------------------------- */

section.addEventListener(
    "pointerdown",
    e => {

        dragging = true;

        startX = e.clientX;

        startPosition = position;

        section.setPointerCapture(
            e.pointerId
        );

        track.classList.add(
            "dragging"
        );
    }
);


section.addEventListener(
    "pointermove",
    e => {

        if (!dragging) return;

        const difference =
            e.clientX - startX;

        position =
            startPosition + difference;
    }
);


section.addEventListener(
    "pointerup",
    () => {

        dragging = false;

        track.classList.remove(
            "dragging"
        );
    }
);


/* --------------------------------
   MOUSE WHEEL
-------------------------------- */

section.addEventListener(
    "wheel",
    e => {

        e.preventDefault();

        position -=
            e.deltaY * 0.7;

    },
    {
        passive: false
    }
);


/* --------------------------------
   START
-------------------------------- */

animate();

</script>

</body>
</html>
